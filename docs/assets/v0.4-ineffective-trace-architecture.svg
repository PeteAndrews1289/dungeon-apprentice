<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">v0.4 matched ineffective-trace architecture study</title>
  <desc id="desc">Two fresh twins inherit the same confirmed U1 policy. Both compute a repeated no-effect trace, but only the candidate sees it. Rewards, learning, and frozen exams are shared.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#18233a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#91a4c3"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,-apple-system,sans-serif;fill:#f5f7fb}
      .sub{font:500 16px system-ui,-apple-system,sans-serif;fill:#aebbd0}
      .head{font:700 19px system-ui,-apple-system,sans-serif;fill:#f7f9fc}
      .body{font:500 14px system-ui,-apple-system,sans-serif;fill:#d7dfec}
      .small{font:600 12px system-ui,-apple-system,sans-serif;fill:#aebbd0;letter-spacing:.4px}
      .card{fill:#202c44;stroke:#3a4c6b;stroke-width:2;rx:18;filter:url(#shadow)}
      .shared{fill:#1d3b47;stroke:#2e7d8d;stroke-width:2;rx:18;filter:url(#shadow)}
      .control{fill:#343145;stroke:#716a90;stroke-width:2;rx:18;filter:url(#shadow)}
      .candidate{fill:#243c35;stroke:#4e9c76;stroke-width:2;rx:18;filter:url(#shadow)}
      .decision{fill:#4a3524;stroke:#d39854;stroke-width:2;rx:18;filter:url(#shadow)}
      .line{fill:none;stroke:#91a4c3;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#66809f;stroke-width:2;stroke-dasharray:7 7}
      .accent{fill:#66d0a0}
      .warn{fill:#f1b36d}
    </style>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>
  <text class="title" x="600" y="48" text-anchor="middle">Can one memory scalar stop a catastrophic loop?</text>
  <text class="sub" x="600" y="76" text-anchor="middle">v0.4 changes the observation only; everything else stays matched</text>

  <rect class="card" x="420" y="105" width="360" height="104"/>
  <text class="small" x="600" y="132" text-anchor="middle">SAME AUTHENTICATED START</text>
  <text class="head" x="600" y="162" text-anchor="middle">Confirmed U1 child 20260733</text>
  <text class="body" x="600" y="187" text-anchor="middle">Policy tensors + Adam moments copied exactly</text>

  <path class="line" d="M520 209 C470 245 340 247 310 285"/>
  <path class="line" d="M680 209 C730 245 860 247 890 285"/>

  <rect class="control" x="100" y="285" width="420" height="190"/>
  <text class="small" x="310" y="315" text-anchor="middle">ARM 1 · CALIBRATION ONLY</text>
  <text class="head" x="310" y="347" text-anchor="middle">trace-sham</text>
  <text class="body" x="310" y="378" text-anchor="middle">Computes the same counter</text>
  <text class="body" x="310" y="401" text-anchor="middle">but always shows the policy 0.0</text>
  <rect x="205" y="425" width="210" height="30" rx="15" fill="#262437"/>
  <text class="body" x="310" y="446" text-anchor="middle">NatureCNN + zero residual</text>

  <rect class="candidate" x="680" y="285" width="420" height="190"/>
  <text class="small" x="890" y="315" text-anchor="middle">ARM 2 · ONLY SELECTABLE ARM</text>
  <text class="head" x="890" y="347" text-anchor="middle">ineffective-trace</text>
  <text class="body" x="890" y="378" text-anchor="middle">Shows min(repeated same-action</text>
  <text class="body" x="890" y="401" text-anchor="middle">unchanged frames, 9) ÷ 9</text>
  <rect x="785" y="425" width="210" height="30" rx="15" fill="#193027"/>
  <text class="body" x="890" y="446" text-anchor="middle">NatureCNN + learned residual</text>

  <rect class="shared" x="355" y="505" width="490" height="72"/>
  <text class="head" x="600" y="534" text-anchor="middle">Shared training and frozen evidence</text>
  <text class="body" x="600" y="559" text-anchor="middle">1,048,576 actions · 32 exams · unchanged reward / PPO / curriculum</text>
  <path class="line" d="M310 475 C350 500 410 505 460 505"/>
  <path class="line" d="M890 475 C850 500 790 505 740 505"/>

  <rect class="decision" x="310" y="604" width="580" height="42"/>
  <text class="body" x="600" y="630" text-anchor="middle">
    Candidate must pass all three terminal exams; checkpoints are always discarded
  </text>
  <path class="line" d="M600 577 L600 604"/>

  <path class="dash" d="M545 255 L655 255"/>
  <circle class="accent" cx="545" cy="255" r="6"/>
  <circle class="warn" cx="655" cy="255" r="6"/>
  <text class="small" x="600" y="261" text-anchor="middle">ONLY THE SCALAR DIFFERS</text>
</svg>
