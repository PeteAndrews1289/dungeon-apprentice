<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dungeon Apprentice v0.3 matched action-effect architecture study</title>
  <desc id="desc">The same confirmed U1 policy is transplanted into two matched recurrent policies. The sham receives zero context while the candidate receives its previous action and whether visible pixels changed. Both begin with an identical rollout, then train and face the same terminal gate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101724"/>
      <stop offset="1" stop-color="#18283a"/>
    </linearGradient>
    <linearGradient id="candidate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e8f88"/>
      <stop offset="1" stop-color="#176a91"/>
    </linearGradient>
    <linearGradient id="parent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5147a8"/>
      <stop offset="1" stop-color="#7451a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#05080d" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa5bb"/>
    </marker>
    <style>
      .title { font: 700 46px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f4f7fb; }
      .subtitle { font: 400 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aabbd0; }
      .eyebrow { font: 700 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; fill: #7ed7d0; }
      .card-title { font: 700 25px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7f9fc; }
      .body { font: 400 19px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d8e0ea; }
      .small { font: 500 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b7c5d4; }
      .metric { font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f7f9fc; }
      .line { stroke: #8fa5bb; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #668096; stroke-width: 3; stroke-dasharray: 9 9; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1490" cy="35" r="250" fill="#238a91" opacity=".08"/>
  <circle cx="80" cy="850" r="270" fill="#7150a4" opacity=".09"/>

  <text x="84" y="82" class="eyebrow">DUNGEON APPRENTICE · PROTOCOL v0.3</text>
  <text x="84" y="139" class="title">Can the agent learn cause and effect?</text>
  <text x="84" y="179" class="subtitle">One inherited policy. Two matched twins. One new piece of self-experience.</text>

  <g filter="url(#shadow)">
    <rect x="84" y="242" width="330" height="222" rx="24" fill="url(#parent)" stroke="#9d8fd6" stroke-width="2"/>
    <text x="114" y="282" class="eyebrow" fill="#d8d0ff">SAME START</text>
    <text x="114" y="324" class="card-title">Confirmed U1 parent</text>
    <text x="114" y="358" class="body">Child 20260733</text>
    <text x="114" y="397" class="small">Every learned tensor and every</text>
    <text x="114" y="422" class="small">Adam optimizer moment copied</text>
    <text x="114" y="447" class="small">by exact parameter name.</text>
  </g>

  <path d="M 414 353 C 482 353, 486 292, 553 292" class="line"/>
  <path d="M 414 353 C 482 353, 486 548, 553 548" class="line"/>

  <g filter="url(#shadow)">
    <rect x="554" y="218" width="430" height="214" rx="24" fill="#273548" stroke="#718399" stroke-width="2"/>
    <text x="584" y="258" class="eyebrow" fill="#c2cfdd">CALIBRATION TWIN</text>
    <text x="584" y="300" class="card-title">Sham context</text>
    <text x="584" y="338" class="body">56 × 56 RGB pixels</text>
    <text x="584" y="369" class="body">+ nine values that are always zero</text>
    <text x="584" y="405" class="small">Same network shape; cannot be selected.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="554" y="474" width="430" height="238" rx="24" fill="url(#candidate)" stroke="#6ad5ce" stroke-width="2"/>
    <text x="584" y="514" class="eyebrow">CANDIDATE TWIN</text>
    <text x="584" y="556" class="card-title">Action-effect context</text>
    <text x="584" y="594" class="body">56 × 56 RGB pixels</text>
    <text x="584" y="625" class="body">+ previous action</text>
    <text x="584" y="656" class="body">+ visible changed / unchanged</text>
    <text x="584" y="692" class="small">No map, object label, route, or demonstration.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="264" width="456" height="194" rx="24" fill="#1d2937" stroke="#5d7288" stroke-width="2"/>
    <text x="1092" y="304" class="eyebrow" fill="#bdcadd">BEFORE LEARNING</text>
    <text x="1092" y="346" class="card-title">Exact matched-rollout gate</text>
    <text x="1092" y="386" class="metric">2,048 identical transitions</text>
    <text x="1092" y="421" class="small">No behavioral divergence is allowed yet.</text>
  </g>

  <path d="M 984 325 C 1025 325, 1021 340, 1060 340" class="dash"/>
  <path d="M 984 573 C 1025 573, 1021 405, 1060 405" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="1060" y="522" width="456" height="190" rx="24" fill="#243244" stroke="#6f849b" stroke-width="2"/>
    <text x="1092" y="562" class="eyebrow" fill="#bdcadd">THEN TRAIN LOCALLY</text>
    <text x="1092" y="604" class="card-title">Same million-action test</text>
    <text x="1092" y="643" class="body">Same reward · PPO · seeds · exams</text>
    <text x="1092" y="679" class="small">Only the candidate can use action-effect context.</text>
  </g>

  <path d="M 1288 458 L 1288 522" class="line"/>

  <g>
    <rect x="190" y="780" width="1220" height="70" rx="18" fill="#111b27" stroke="#41556a" stroke-width="2"/>
    <text x="222" y="823" class="body">Decision:</text>
    <text x="320" y="823" class="metric">candidate passes all final 3 exams</text>
    <text x="765" y="823" class="body">→ authorize fresh three-lineage replication</text>
    <text x="1245" y="823" class="small">U3 stays closed</text>
  </g>
</svg>
