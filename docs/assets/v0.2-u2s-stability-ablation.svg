<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">U2-S matched interaction-stability ablation</title>
  <desc id="desc">Four fresh children start from one confirmed U1 parent. A two-by-two comparison crosses existing versus conservative PPO with no added feedback versus a bounded pixels-only no-effect penalty. All cells receive the same random streams and full budget. Only the fixed terminal window selects a configuration; no ablation checkpoint advances.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#17142b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#67e8f9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 35px; font-weight: 800; letter-spacing: -0.8px; fill: #f8fafc; }
      .sub { font-size: 16px; font-weight: 520; fill: #a8b5cf; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; }
      .head { font-size: 21px; font-weight: 760; fill: #f8fafc; }
      .body { font-size: 14px; font-weight: 540; fill: #cbd5e1; }
      .small { font-size: 12px; font-weight: 540; fill: #94a3b8; }
      .axis { font-size: 13px; font-weight: 740; fill: #dbeafe; letter-spacing: 0.3px; }
      .number { font-size: 28px; font-weight: 820; fill: #fff; }
      .footer { font-size: 17px; font-weight: 720; fill: #d1fae5; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#background)"/>
  <circle cx="65" cy="700" r="250" fill="#06b6d4" opacity="0.05"/>
  <circle cx="1220" cy="45" r="240" fill="#8b5cf6" opacity="0.07"/>

  <g class="sans">
    <text class="title" x="50" y="57">U2-S: stop rescuing checkpoints—test the learning mechanism</text>
    <text class="sub" x="50" y="88">One confirmed parent • four matched fresh children • full budgets • fixed terminal decision</text>

    <g transform="translate(48 144)" filter="url(#shadow)">
      <rect width="238" height="388" rx="24" fill="#141b2d" stroke="#285a68"/>
      <text class="eyebrow" x="22" y="35" fill="#67e8f9">ONE FROZEN BOUNDARY</text>
      <text class="head" x="22" y="72">Confirmed U1 parent</text>
      <text class="small" x="22" y="98">Child 20260733</text>

      <rect x="22" y="126" width="194" height="92" rx="15" fill="#102a35" stroke="#0e7490"/>
      <text class="number" x="38" y="163">4× fresh</text>
      <text class="body" x="38" y="188">policy + optimizer loads</text>
      <text class="small" x="38" y="207">never U2 or U2r</text>

      <text class="body" x="22" y="257">Same algorithm seed</text>
      <text class="body" x="22" y="282">Same four worker streams</text>
      <text class="body" x="22" y="307">Same guarded curriculum</text>
      <text class="body" x="22" y="332">Same pre-action RNG state</text>
      <text class="small" x="22" y="365">Matched trajectories, not</text>
      <text class="small" x="22" y="382">independent replications.</text>
    </g>

    <path d="M302 338 C328 338 337 338 362 338" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(376 116)">
      <text class="axis" x="108" y="18">NO ADDED FEEDBACK</text>
      <text class="axis" x="368" y="18">PIXELS-ONLY NO-EFFECT FEEDBACK</text>
      <text class="axis" transform="translate(2 210) rotate(-90)">EXISTING PPO</text>
      <text class="axis" transform="translate(2 440) rotate(-90)">CONSERVATIVE PPO</text>

      <g transform="translate(38 38)" filter="url(#shadow)">
        <rect width="252" height="202" rx="20" fill="#171d2f" stroke="#475569"/>
        <text class="eyebrow" x="20" y="31" fill="#cbd5e1">A · CONTROL</text>
        <text class="head" x="20" y="67">Current learner</text>
        <text class="body" x="20" y="96">PPO unchanged</text>
        <text class="body" x="20" y="120">Reward unchanged</text>
        <rect x="20" y="143" width="212" height="38" rx="11" fill="#222a3d"/>
        <text class="small" x="34" y="167">Does the baseline stabilize?</text>
      </g>

      <g transform="translate(310 38)" filter="url(#shadow)">
        <rect width="252" height="202" rx="20" fill="#172035" stroke="#0e7490"/>
        <text class="eyebrow" x="20" y="31" fill="#67e8f9">C · NO-EFFECT</text>
        <text class="head" x="20" y="67">Experience feedback</text>
        <text class="body" x="20" y="96">PPO unchanged</text>
        <text class="body" x="20" y="120">−0.01 repeated visible no-op</text>
        <rect x="20" y="143" width="212" height="38" rx="11" fill="#102a35"/>
        <text class="small" x="34" y="167">Episode cap: −0.10</text>
      </g>

      <g transform="translate(38 260)" filter="url(#shadow)">
        <rect width="252" height="202" rx="20" fill="#211b35" stroke="#6d4cc7"/>
        <text class="eyebrow" x="20" y="31" fill="#c4b5fd">B · CONSERVATIVE</text>
        <text class="head" x="20" y="67">Gentler updates</text>
        <text class="body" x="20" y="96">LR decay • clip 0.10</text>
        <text class="body" x="20" y="120">2 epochs • target KL 0.015</text>
        <rect x="20" y="143" width="212" height="38" rx="11" fill="#2b2142"/>
        <text class="small" x="34" y="167">Reward unchanged</text>
      </g>

      <g transform="translate(310 260)" filter="url(#shadow)">
        <rect width="252" height="202" rx="20" fill="#20203a" stroke="#8b5cf6"/>
        <text class="eyebrow" x="20" y="31" fill="#ddd6fe">D · COMBINED</text>
        <text class="head" x="20" y="67">Both interventions</text>
        <text class="body" x="20" y="96">Conservative PPO</text>
        <text class="body" x="20" y="120">+ bounded no-effect feedback</text>
        <rect x="20" y="143" width="212" height="38" rx="11" fill="#2a2545"/>
        <text class="small" x="34" y="167">Only if simpler cells fail</text>
      </g>
    </g>

    <path d="M958 338 C980 338 990 338 1012 338" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1026 144)" filter="url(#shadow)">
      <rect width="206" height="388" rx="24" fill="#14252b" stroke="#2dd4bf"/>
      <text class="eyebrow" x="20" y="35" fill="#6ee7b7">FIXED DECISION</text>
      <text class="head" x="20" y="70">Terminal 3 exams</text>
      <text class="small" x="20" y="94">Every arm runs 1,048,576</text>
      <text class="small" x="20" y="111">new actions and 32 exams.</text>

      <rect x="20" y="138" width="166" height="142" rx="15" fill="#10302e" stroke="#178b7d"/>
      <text class="body" x="34" y="165">U2 ≥ 72 / 80</text>
      <text class="body" x="34" y="191">Panels ≥ 34 / 40</text>
      <text class="body" x="34" y="217">Means ≤ 3.0</text>
      <text class="body" x="34" y="243">No 10+ case or loop</text>
      <text class="small" x="34" y="267">Each exam passes alone.</text>

      <text class="body" x="20" y="315">Priority:</text>
      <text class="small" x="20" y="339">control → conservative</text>
      <text class="small" x="20" y="358">→ no-effect → combined</text>
      <text class="small" x="20" y="383">Configuration only.</text>
    </g>

    <g transform="translate(48 584)">
      <rect width="1184" height="122" rx="22" fill="#122b2c" stroke="#2dd4bf"/>
      <text class="eyebrow" x="22" y="32" fill="#6ee7b7">SCIENTIFIC BOUNDARY</text>
      <text class="footer" x="22" y="62">No resume • no “best” checkpoint • no ablation policy advances</text>
      <text class="body" x="22" y="88">Success identifies a learner configuration worth fresh multi-lineage replication.</text>
      <text class="body" x="22" y="108">Failure ends this PPO-and-reward family and points the next iteration toward architecture.</text>
    </g>
  </g>
</svg>
