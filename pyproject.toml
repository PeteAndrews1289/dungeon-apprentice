[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dungeon-apprentice"
version = "0.1.0"
description = "A procedural visual dungeon for studying cumulative experiential learning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peter Andrews" }]
dependencies = [
  "gymnasium>=1.1,<2",
  "minigrid>=3.0,<4",
  "numpy>=2.0,<3",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]
train = [
  "sb3-contrib>=2.6,<3",
  "stable-baselines3>=2.6,<3",
  "torch>=2.7",
]

[project.scripts]
dungeon-qualify = "dungeon_apprentice.qualify:main"
dungeon-train = "dungeon_apprentice.train:main"
dungeon-evaluate = "dungeon_apprentice.evaluate:main"
dungeon-dashboard = "dungeon_apprentice.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dungeon_apprentice"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

